<!doctype html>
<html lang="__LANG__">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__WIDTH__, height=__HEIGHT__" />
__PRELOADS__
    <link rel="preload" as="image" href="__HAND_ASSET__" />
    <style>
      :root {
        color-scheme: dark;
        --canvas-width: __WIDTH__px;
        --canvas-height: __HEIGHT__px;
        --accent: __ACCENT__;
        --accent-soft: __ACCENT_SOFT__;
        --ambient-x: 78%;
        --ambient-y: 12%;
        --ink: #f8fafc;
        --muted: #b8c0cc;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: var(--canvas-width);
        height: var(--canvas-height);
        margin: 0;
        overflow: hidden;
        background: #080a0f;
      }

      body {
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, sans-serif;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        isolation: isolate;
        background: #080a0f;
      }

      .tutorial-background {
        position: absolute;
        z-index: 0;
        inset: 0;
        overflow: hidden;
        background: #090b11;
      }

      .tutorial-background__image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 1;
      }

      .tutorial__asset-catalog {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
        visibility: hidden;
      }

      .tutorial__asset-catalog img {
        width: 1px;
        height: 1px;
      }

      .tutorial__visual {
        position: absolute;
        z-index: 1;
        inset: 0;
        overflow: hidden;
      }

      .tutorial__camera {
        position: absolute;
        inset: 0;
      }

      .tutorial__asset-slot {
        position: absolute;
        inset: 0;
        opacity: 0;
        will-change: opacity, transform, clip-path;
      }

      .tutorial__asset-slot--shell {
        z-index: 0;
      }

      .tutorial__asset-slot--current {
        z-index: 1;
        opacity: 1;
      }

      .tutorial__asset-slot--target {
        z-index: 2;
      }

      .tutorial__asset {
        position: absolute;
        display: block;
        object-position: center;
        user-select: none;
        will-change: transform;
      }

      .tutorial__asset-slot[data-presentation="full"] .tutorial__asset {
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .tutorial__asset-slot[data-presentation="device"] .tutorial__asset {
        top: 52%;
        left: 71%;
        width: auto;
        max-width: 56%;
        height: 82%;
        object-fit: contain;
        transform: translate(-50%, -50%);
      }

      .tutorial__interaction-layer {
        position: absolute;
        z-index: 3;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .tutorial__field-layer {
        position: absolute;
        z-index: 3;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .tutorial__field-fill {
        position: absolute;
        overflow: hidden;
        background: #fff;
      }

      .tutorial__field-fill-image {
        position: absolute;
        display: block;
        max-width: none;
        user-select: none;
        will-change: clip-path;
      }

      .tutorial__type-field {
        position: absolute;
        display: flex;
        align-items: center;
        overflow: hidden;
        background: #fff;
        color: #292a2d;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 700;
        letter-spacing: 0.01em;
        white-space: nowrap;
        opacity: 0;
      }

      .tutorial__typed-text {
        display: inline-block;
        font-variant-numeric: tabular-nums;
      }

      .tutorial__caret {
        display: inline-block;
        width: clamp(2px, 0.28vmin, 5px);
        height: 72%;
        margin-left: 0.035em;
        border-radius: 999px;
        background: #ff7068;
        opacity: 0;
      }

      .tutorial__otp-field {
        position: absolute;
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        align-items: stretch;
        background: #fff;
        opacity: 0;
      }

      .tutorial__otp-box {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        border: clamp(2px, 0.22vmin, 4px) solid transparent;
        border-radius: clamp(6px, 0.7vmin, 12px);
        background: #f6f6f6;
        color: #292a2d;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .tutorial__otp-box[data-active="true"] {
        border-color: #ff7068;
        background: #fff;
      }

      .tutorial__otp-box[data-active="true"]::after {
        position: absolute;
        top: 30%;
        bottom: 30%;
        left: 50%;
        width: clamp(2px, 0.28vmin, 5px);
        border-radius: 999px;
        background: #ff7068;
        content: "";
        transform: translateX(-50%);
      }

      .tutorial__tap {
        position: absolute;
        z-index: 4;
        left: 50%;
        top: 50%;
        width: clamp(42px, 4.2vmin, 76px);
        height: clamp(42px, 4.2vmin, 76px);
        border: clamp(3px, 0.32vmin, 6px) solid #fff;
        border-radius: 50%;
        background: color-mix(in srgb, var(--accent) 52%, transparent);
        box-shadow:
          0 0 0 12px color-mix(in srgb, var(--accent) 21%, transparent),
          0 0 32px var(--accent-soft);
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.9);
        will-change: left, top, opacity, transform;
      }

      .tutorial__hand {
        position: absolute;
        z-index: 5;
        left: 50%;
        top: 50%;
        display: block;
        width: 56%;
        height: auto;
        opacity: 0;
        pointer-events: none;
        user-select: none;
        will-change: left, top, width, opacity, transform;
      }

      .tutorial__subtitle {
        position: absolute;
        z-index: 5;
        top: 50%;
        left: 6%;
        display: flex;
        width: 31%;
        flex-direction: column;
        align-items: flex-start;
        padding-left: clamp(18px, 1.8vmin, 34px);
        border-left: clamp(4px, 0.42vmin, 8px) solid var(--accent);
        background: none;
        color: #fff;
        text-align: left;
        text-shadow: 0 2px 16px rgba(0, 0, 0, 0.48);
        transform: translateY(-50%);
        will-change: opacity, transform;
      }

      .tutorial__subtitle-step {
        margin-bottom: clamp(16px, 1.8vmin, 30px);
        color: var(--accent);
        font-size: clamp(17px, 1.25vmin, 25px);
        font-weight: 900;
        letter-spacing: 0.18em;
        line-height: 1;
        text-transform: uppercase;
      }

      .tutorial__subtitle-title {
        color: #fff;
        font-size: clamp(42px, 3.8vmin, 72px);
        font-weight: 900;
        letter-spacing: -0.045em;
        line-height: 0.98;
      }

      .tutorial__subtitle-body {
        margin-top: clamp(18px, 2.1vmin, 36px);
        color: #c7ced8;
        font-size: clamp(23px, 1.9vmin, 38px);
        font-weight: 350;
        line-height: 1.42;
      }

      @media (prefers-reduced-motion: reduce) {
        .tutorial__subtitle {
          transform: translateY(-50%) !important;
        }
      }

    </style>
  </head>
  <body class="layout-__LAYOUT__">
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="__DURATION__"
      data-width="__WIDTH__"
      data-height="__HEIGHT__"
    >
      <div class="tutorial-background" data-loan-video-background aria-hidden="true">
        <img class="tutorial-background__image" data-loan-video-background-image src="__INITIAL_BACKGROUND__" alt="" />
      </div>
__ASSET_CATALOG__
      <div class="tutorial__visual">
        <div class="tutorial__camera">
          <div class="tutorial__asset-slot tutorial__asset-slot--shell" data-presentation="full">
            <img class="tutorial__asset" data-loan-video-shell src="__INITIAL_CURRENT__" alt="" />
          </div>
          <div class="tutorial__asset-slot tutorial__asset-slot--current" data-presentation="full">
            <img class="tutorial__asset" data-loan-video-current src="__INITIAL_CURRENT__" alt="" />
          </div>
          <div class="tutorial__asset-slot tutorial__asset-slot--target" data-presentation="full">
            <img class="tutorial__asset" data-loan-video-target src="__INITIAL_TARGET__" alt="" />
          </div>
          <div class="tutorial__interaction-layer" data-loan-video-interaction-layer aria-hidden="true">
            <div class="tutorial__type-field" data-loan-video-type-field>
              <span class="tutorial__typed-text" data-loan-video-typed-text></span>
              <span class="tutorial__caret" data-loan-video-caret></span>
            </div>
            <div class="tutorial__otp-field" data-loan-video-otp-field></div>
          </div>
          <div class="tutorial__field-layer" data-loan-video-field-layer aria-hidden="true"></div>
          <span class="tutorial__tap" data-loan-video-tap aria-hidden="true"></span>
          <img class="tutorial__hand" data-loan-video-hand src="__HAND_ASSET__" alt="" aria-hidden="true" />
        </div>
      </div>
__SUBTITLE__
__AUDIO__
    </div>

    <script id="loan-video-manifest" type="application/json">__MANIFEST__</script>
    <script>
      (() => {
        const manifest = JSON.parse(document.getElementById("loan-video-manifest").textContent);
        const duration = manifest.durationSeconds;
        const scenes = manifest.scenes;
        const root = document.getElementById("root");
        const visual = root.querySelector(".tutorial__visual");
        const camera = root.querySelector(".tutorial__camera");
        const shellSlot = root.querySelector(".tutorial__asset-slot--shell");
        const currentSlot = root.querySelector(".tutorial__asset-slot--current");
        const targetSlot = root.querySelector(".tutorial__asset-slot--target");
        const shellAsset = root.querySelector("[data-loan-video-shell]");
        const currentAsset = root.querySelector("[data-loan-video-current]");
        const targetAsset = root.querySelector("[data-loan-video-target]");
        const backgroundImage = root.querySelector("[data-loan-video-background-image]");
        const interactionLayer = root.querySelector("[data-loan-video-interaction-layer]");
        const typeField = root.querySelector("[data-loan-video-type-field]");
        const typedText = root.querySelector("[data-loan-video-typed-text]");
        const caret = root.querySelector("[data-loan-video-caret]");
        const otpField = root.querySelector("[data-loan-video-otp-field]");
        const fieldLayer = root.querySelector("[data-loan-video-field-layer]");
        const tap = root.querySelector(".tutorial__tap");
        const hand = root.querySelector(".tutorial__hand");
        const subtitle = root.querySelector(".tutorial__subtitle");
        const subtitleStep = root.querySelector("[data-loan-video-subtitle-step]");
        const subtitleTitle = root.querySelector("[data-loan-video-subtitle-title]");
        const subtitleBody = root.querySelector("[data-loan-video-subtitle-body]");
        const handWidthRatio = 0.56;
        const deviceCenterXRatio = 0.71;
        const deviceCenterYRatio = 0.52;
        const deviceMaxWidthRatio = 0.56;
        const deviceMaxHeightRatio = 0.82;
        const deviceContentInsetX = 0.046;
        const deviceContentInsetBottom = 0.026;
        const otpPool = Array.from({ length: 8 }, () => {
          const box = document.createElement("span");
          box.className = "tutorial__otp-box";
          otpField.appendChild(box);
          return box;
        });
        const fieldPool = Array.from({ length: 12 }, () => {
          const field = document.createElement("span");
          const image = document.createElement("img");
          field.className = "tutorial__field-fill";
          image.className = "tutorial__field-fill-image";
          image.alt = "";
          field.appendChild(image);
          fieldLayer.appendChild(field);
          return { field, image };
        });

        const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
        const ease = (value) => 1 - Math.pow(1 - clamp(value, 0, 1), 3);
        const setSource = (image, source) => {
          if (source && image.getAttribute("src") !== source) image.setAttribute("src", source);
          if (!source) image.removeAttribute("src");
        };
        const setPresentation = (slot, presentation) => {
          slot.setAttribute("data-presentation", presentation === "device" ? "device" : "full");
        };
        const displayedImageRect = (image, presentation) => {
          const width = visual.clientWidth;
          const height = visual.clientHeight;
          if (presentation !== "device") return { left: 0, top: 0, width, height };
          const naturalWidth = image.naturalWidth || width;
          const naturalHeight = image.naturalHeight || height;
          const scale = Math.min(
            (width * deviceMaxWidthRatio) / naturalWidth,
            (height * deviceMaxHeightRatio) / naturalHeight,
          );
          const displayedWidth = naturalWidth * scale;
          const displayedHeight = naturalHeight * scale;
          return {
            left: width * deviceCenterXRatio - displayedWidth / 2,
            top: height * deviceCenterYRatio - displayedHeight / 2,
            width: displayedWidth,
            height: displayedHeight,
          };
        };

        const keyboardTapPoint = (digit) => ({
          "1": { x: 0.132, y: 0.742 },
          "2": { x: 0.376, y: 0.742 },
          "3": { x: 0.622, y: 0.742 },
          "4": { x: 0.132, y: 0.804 },
          "5": { x: 0.376, y: 0.804 },
          "6": { x: 0.622, y: 0.804 },
          "7": { x: 0.132, y: 0.869 },
          "8": { x: 0.376, y: 0.869 },
          "9": { x: 0.622, y: 0.869 },
          "0": { x: 0.376, y: 0.934 },
        }[digit] || null);

        const formatMobileNumber = (digits) => (
          String(digits || "").replace(/\D/g, "").match(/.{1,3}/g)?.join(" ") || ""
        );

        const keypadTiming = (scene, interaction) => {
          const count = Math.max(1, interaction.text.length);
          const duration = Math.max(interaction.duration, count * 0.38);
          return {
            count,
            duration,
            start: scene.start + interaction.start,
            step: duration / count,
          };
        };

        const renderFieldInputs = (scene, time, imageRect, options = {}) => {
          const targets = scene?.presentation === "device" && !scene.interaction
            ? (scene.focusTargets || [])
            : [];
          const forceBlank = options.forceBlank === true;
          const translateX = Number(options.translateX) || 0;
          const revealWindow = Math.min(1.82, Math.max(0.72, scene?.duration * 0.48 || 0.72));
          const step = revealWindow / Math.max(1, targets.length);
          fieldPool.forEach(({ field, image }, index) => {
            const target = targets[index];
            if (!target) {
              field.style.display = "none";
              return;
            }
            const start = Math.max(0.2, scene.duration * 0.08) + step * index;
            const end = start + Math.min(0.24, Math.max(0.14, step * 0.78));
            const localTime = time - scene.start;
            const progress = forceBlank ? 0 : ease((localTime - start) / (end - start));
            const left = imageRect.left + imageRect.width * target.x;
            const top = imageRect.top + imageRect.height * target.y;
            const width = imageRect.width * target.width;
            const height = imageRect.height * target.height;
            field.style.display = "block";
            field.style.left = `${left.toFixed(2)}px`;
            field.style.top = `${top.toFixed(2)}px`;
            field.style.width = `${width.toFixed(2)}px`;
            field.style.height = `${height.toFixed(2)}px`;
            field.style.transform = `translateX(${translateX.toFixed(2)}px)`;
            setSource(image, scene.asset);
            image.style.left = `${(-imageRect.width * target.x).toFixed(2)}px`;
            image.style.top = `${(-imageRect.height * target.y).toFixed(2)}px`;
            image.style.width = `${imageRect.width.toFixed(2)}px`;
            image.style.height = `${imageRect.height.toFixed(2)}px`;
            image.style.clipPath = `inset(0 ${((1 - progress) * 100).toFixed(3)}% 0 0)`;
          });
        };

        const renderInteraction = (scene, time, imageRect) => {
          const interaction = scene.interaction;
          typeField.style.opacity = "0";
          otpField.style.opacity = "0";
          interactionLayer.style.opacity = "1";
          if (!interaction || scene.presentation !== "device") return;

          const timing = interaction.type === "otp" || interaction.type === "keypad"
            ? keypadTiming(scene, interaction)
            : {
                duration: interaction.duration,
                start: scene.start + interaction.start,
              };
          const start = timing.start;
          const end = start + timing.duration;
          const progress = clamp((time - start) / Math.max(0.000001, timing.duration), 0, 1);
          const target = interaction.target;
          const left = imageRect.left + imageRect.width * target.x;
          const top = imageRect.top + imageRect.height * target.y;
          const width = imageRect.width * target.width;
          const height = imageRect.height * target.height;
          const transitionFadeStart = scene.transition.start === null
            ? scene.start + scene.duration
            : scene.transition.start - 0.08;
          const fade = 1 - ease((time - transitionFadeStart) / 0.08);
          interactionLayer.style.opacity = String(clamp(fade, 0, 1).toFixed(4));

          if (interaction.type === "type" || interaction.type === "keypad") {
            const characters = interaction.type === "keypad"
              ? interaction.text.split("").reduce((count, _character, index) => (
                  time >= timing.start + timing.step * index + timing.step * 0.42
                    ? count + 1
                    : count
                ), 0)
              : Math.min(
                  interaction.text.length,
                  Math.floor(progress * (interaction.text.length + 0.999)),
                );
            typeField.style.left = `${left.toFixed(2)}px`;
            typeField.style.top = `${top.toFixed(2)}px`;
            typeField.style.width = `${width.toFixed(2)}px`;
            typeField.style.height = `${height.toFixed(2)}px`;
            typeField.style.padding = `0 ${(height * 0.08).toFixed(2)}px`;
            typeField.style.fontSize = `${(height * 0.62).toFixed(2)}px`;
            typeField.style.opacity = "1";
            typedText.textContent = interaction.type === "keypad"
              ? formatMobileNumber(interaction.text.slice(0, characters))
              : interaction.text.slice(0, characters);
            caret.style.opacity = time >= start && time <= end + 0.18
              ? String((Math.floor((time - start) * 6) % 2 === 0 ? 1 : 0.28).toFixed(2))
              : "0";
            return;
          }

          const boxCount = interaction.text.length;
          const gap = width * 0.04;
          otpField.style.left = `${left.toFixed(2)}px`;
          otpField.style.top = `${top.toFixed(2)}px`;
          otpField.style.width = `${width.toFixed(2)}px`;
          otpField.style.height = `${height.toFixed(2)}px`;
          otpField.style.gap = `${gap.toFixed(2)}px`;
          otpField.style.fontSize = `${(height * 0.58).toFixed(2)}px`;
          otpField.style.opacity = "1";
          const characters = interaction.text.split("").reduce((count, _character, index) => (
            time >= timing.start + timing.step * index + timing.step * 0.42
              ? count + 1
              : count
          ), 0);
          otpPool.forEach((box, index) => {
            const exists = index < boxCount;
            box.style.display = exists ? "flex" : "none";
            box.textContent = exists && index < characters ? interaction.text[index] : "";
            box.setAttribute(
              "data-active",
              exists && characters < boxCount && index === characters && time <= end ? "true" : "false",
            );
          });
        };

        const renderGesture = (gesture, time, imageRect) => {
          if (!gesture || time < gesture.pointerStartAt || time >= gesture.endAt) {
            tap.style.opacity = "0";
            hand.style.opacity = "0";
            return;
          }
          const focalX = imageRect.left + imageRect.width * gesture.x;
          const focalY = imageRect.top + imageRect.height * gesture.y;
          const pointerProgress = ease(
            (time - gesture.pointerStartAt)
              / Math.max(0.000001, gesture.pressAt - gesture.pointerStartAt),
          );
          const pressProgress = clamp(
            (time - gesture.pressAt) / Math.max(0.000001, gesture.rippleAt - gesture.pressAt),
            0,
            1,
          );
          const rippleProgress = clamp(
            (time - gesture.rippleAt)
              / Math.max(0.000001, gesture.responseAt - gesture.rippleAt),
            0,
            1,
          );
          const responseProgress = clamp(
            (time - gesture.responseAt)
              / Math.max(0.000001, gesture.endAt - gesture.responseAt),
            0,
            1,
          );
          const ripple = Math.sin(Math.PI * rippleProgress);
          tap.style.left = `${focalX.toFixed(2)}px`;
          tap.style.top = `${focalY.toFixed(2)}px`;
          tap.style.opacity = String((pointerProgress * (1 - responseProgress) * 0.96).toFixed(4));
          tap.style.transform = `translate(-50%, -50%) scale(${(
            0.9 - pressProgress * 0.08 + ripple * 0.3
          ).toFixed(4)})`;

          const handWidth = clamp(imageRect.width * handWidthRatio, 150, 420);
          const mirrored = gesture.x > 0.72;
          const fingertipX = handWidth * 0.145;
          const fingertipY = handWidth * 0.105;
          const approachOffsetX = (mirrored ? -1 : 1)
            * imageRect.width * 0.17 * (1 - pointerProgress);
          const approachOffsetY = imageRect.height * 0.075 * (1 - pointerProgress);
          const pressDepth = imageRect.width * 0.008 * pressProgress;
          const lift = imageRect.width * 0.006 * rippleProgress;
          const handScale = 1 - pressProgress * 0.025 + ripple * 0.012;
          hand.style.left = `${focalX.toFixed(2)}px`;
          hand.style.top = `${focalY.toFixed(2)}px`;
          hand.style.width = `${handWidth.toFixed(2)}px`;
          hand.style.opacity = String((pointerProgress * (1 - responseProgress)).toFixed(4));
          hand.style.transformOrigin = "0 0";
          hand.style.transform = `translate(${(
            (mirrored ? fingertipX : -fingertipX) * handScale
              + approachOffsetX + pressDepth - lift
          ).toFixed(2)}px, ${(
            -fingertipY * handScale + approachOffsetY + pressDepth - lift
          ).toFixed(2)}px) scaleX(${mirrored ? -1 : 1}) scale(${handScale.toFixed(4)})`;
        };

        const renderAt = (seconds) => {
          const time = clamp(Number(seconds) || 0, 0, Math.max(0, duration));
          let sceneIndex = scenes.findIndex((scene) => time < scene.start + scene.duration - 0.000001);
          if (sceneIndex < 0) sceneIndex = scenes.length - 1;
          const scene = scenes[sceneIndex];
          const targetScene = scene.transition.targetSceneIndex
            ? scenes[scene.transition.targetSceneIndex - 1]
            : null;
          const transitionProgress = targetScene && scene.transition.start !== null
            ? ease((time - scene.transition.start) / (scene.transition.end - scene.transition.start))
            : 0;
          const action = scene.transition;

          const currentPresentation = scene.presentation || "full";
          const targetPresentation = targetScene?.presentation || "full";
          setSource(backgroundImage, manifest.backgroundAsset || scene.asset);
          if (action.type === "close-modal" && targetScene) {
            setSource(shellAsset, targetScene.asset);
            setPresentation(shellSlot, targetPresentation);
          } else {
            setSource(shellAsset, scene.asset);
            setPresentation(shellSlot, currentPresentation);
          }
          setSource(currentAsset, scene.asset);
          setSource(targetAsset, targetScene?.asset);
          setPresentation(currentSlot, currentPresentation);
          setPresentation(targetSlot, targetPresentation);
          const imageRect = displayedImageRect(currentAsset, currentPresentation);
          const targetImageRect = displayedImageRect(targetAsset, targetPresentation);
          const modalTransition = action.type === "open-modal"
            || action.type === "close-modal";
          shellSlot.style.opacity = "0";
          currentSlot.style.clipPath = "none";
          targetSlot.style.clipPath = "none";
          shellSlot.style.transform = "none";
          currentSlot.style.transform = "none";
          targetSlot.style.transform = "none";
          shellAsset.style.transform = "";
          currentAsset.style.transform = "";
          targetAsset.style.transform = "";
          shellAsset.style.clipPath = "none";
          currentAsset.style.clipPath = "none";
          targetAsset.style.clipPath = "none";
          fieldLayer.style.clipPath = "none";
          shellSlot.style.zIndex = "0";
          currentSlot.style.zIndex = "1";
          targetSlot.style.zIndex = "2";
          let fieldsRendered = false;
          const deviceToDevice = currentPresentation === "device"
            && targetPresentation === "device";
          if (action.type === "open-modal") {
            const clipTop = targetImageRect.top + targetImageRect.height * (action.clipTop || 0);
            const clipRight = visual.clientWidth - targetImageRect.left - targetImageRect.width;
            const clipBottom = visual.clientHeight - targetImageRect.top - targetImageRect.height;
            const travel = targetImageRect.height * (1 - (action.clipTop || 0));
            const offsetY = (1 - transitionProgress) * travel;
            const movingClipTop = clipTop + offsetY;
            shellSlot.style.opacity = "1";
            currentSlot.style.opacity = "0";
            targetSlot.style.opacity = "1";
            targetSlot.style.clipPath = `inset(${movingClipTop.toFixed(2)}px ${clipRight.toFixed(2)}px ${clipBottom.toFixed(2)}px ${targetImageRect.left.toFixed(2)}px)`;
            targetAsset.style.transform = `translate(-50%, calc(-50% + ${offsetY.toFixed(2)}px))`;
          } else if (action.type === "close-modal") {
            const clipTop = imageRect.top + imageRect.height * (action.clipTop || 0);
            const clipRight = visual.clientWidth - imageRect.left - imageRect.width;
            const clipBottom = visual.clientHeight - imageRect.top - imageRect.height;
            const travel = imageRect.height * (1 - (action.clipTop || 0));
            const offsetY = transitionProgress * travel;
            const movingClipTop = clipTop + offsetY;
            shellSlot.style.opacity = "1";
            currentSlot.style.opacity = "1";
            currentSlot.style.zIndex = "2";
            targetSlot.style.opacity = "0";
            currentSlot.style.clipPath = `inset(${movingClipTop.toFixed(2)}px ${clipRight.toFixed(2)}px ${clipBottom.toFixed(2)}px ${imageRect.left.toFixed(2)}px)`;
            currentAsset.style.transform = `translate(-50%, calc(-50% + ${offsetY.toFixed(2)}px))`;
          } else if (deviceToDevice) {
            const currentContentClipTop = imageRect.top + imageRect.height * 0.106;
            const currentContentLeft = imageRect.left + imageRect.width * deviceContentInsetX;
            const currentContentRight = visual.clientWidth
              - imageRect.left - imageRect.width * (1 - deviceContentInsetX);
            const currentClipBottom = visual.clientHeight
              - imageRect.top - imageRect.height * (1 - deviceContentInsetBottom);
            const deviceContentClipTop = targetImageRect.top + targetImageRect.height * 0.106;
            const deviceContentLeft = targetImageRect.left
              + targetImageRect.width * deviceContentInsetX;
            const deviceContentRight = visual.clientWidth
              - targetImageRect.left - targetImageRect.width * (1 - deviceContentInsetX);
            const deviceClipBottom = visual.clientHeight
              - targetImageRect.top - targetImageRect.height * (1 - deviceContentInsetBottom);
            const currentContentWidth = imageRect.width * (1 - deviceContentInsetX * 2);
            const targetContentWidth = targetImageRect.width * (1 - deviceContentInsetX * 2);
            const currentOffsetX = transitionProgress * currentContentWidth;
            const offsetX = (1 - transitionProgress) * targetContentWidth;
            shellSlot.style.opacity = "1";
            currentSlot.style.opacity = "1";
            targetSlot.style.opacity = transitionProgress > 0 ? "1" : "0";
            currentSlot.style.clipPath = `inset(${currentContentClipTop.toFixed(2)}px ${currentContentRight.toFixed(2)}px ${currentClipBottom.toFixed(2)}px ${currentContentLeft.toFixed(2)}px)`;
            targetSlot.style.clipPath = `inset(${deviceContentClipTop.toFixed(2)}px ${deviceContentRight.toFixed(2)}px ${deviceClipBottom.toFixed(2)}px ${deviceContentLeft.toFixed(2)}px)`;
            currentAsset.style.clipPath = `inset(10.6% ${deviceContentInsetX * 100}% ${deviceContentInsetBottom * 100}% ${deviceContentInsetX * 100}%)`;
            targetAsset.style.clipPath = `inset(10.6% ${deviceContentInsetX * 100}% ${deviceContentInsetBottom * 100}% ${deviceContentInsetX * 100}%)`;
            currentAsset.style.transform = `translate(calc(-50% - ${currentOffsetX.toFixed(2)}px), -50%)`;
            targetAsset.style.transform = `translate(calc(-50% + ${offsetX.toFixed(2)}px), -50%)`;
            if (time >= action.start && targetScene?.focusTargets?.length) {
              fieldLayer.style.clipPath = targetSlot.style.clipPath;
              renderFieldInputs(targetScene, time, targetImageRect, {
                forceBlank: true,
                translateX: offsetX,
              });
              fieldsRendered = true;
            }
          } else if (currentPresentation === "full" && targetPresentation === "device") {
            currentSlot.style.opacity = String(1 - transitionProgress);
            targetSlot.style.opacity = String(transitionProgress);
            currentSlot.style.transform = "none";
            targetSlot.style.transform = `translateY(${(6 * (1 - transitionProgress)).toFixed(3)}%) scale(${(0.96 + transitionProgress * 0.04).toFixed(4)})`;
          } else if (currentPresentation === "device" && targetPresentation === "full") {
            currentSlot.style.opacity = String(1 - transitionProgress);
            targetSlot.style.opacity = String(transitionProgress);
            currentSlot.style.transform = `translateY(${(-3 * transitionProgress).toFixed(3)}%) scale(${(1 - transitionProgress * 0.02).toFixed(4)})`;
            targetSlot.style.transform = "none";
          } else {
            currentSlot.style.opacity = String(1 - transitionProgress);
            targetSlot.style.opacity = String(transitionProgress);
            currentSlot.style.transform = "none";
            targetSlot.style.transform = "none";
          }

          if (!fieldsRendered) {
            if (modalTransition) renderFieldInputs(null, time, imageRect);
            else renderFieldInputs(scene, time, imageRect);
          }

          const isTap = action.type === "tap" || modalTransition;
          const x = isTap ? action.x : 0.5;
          const y = isTap ? action.y : 0.5;
          camera.style.transform = "none";
          renderInteraction(scene, time, imageRect);
          let gesture = null;
          if (scene.interaction) {
            if (scene.interaction.type === "otp" || scene.interaction.type === "keypad") {
              const timing = keypadTiming(scene, scene.interaction);
              const digitIndex = Math.floor((time - timing.start) / timing.step);
              const point = digitIndex >= 0 && digitIndex < scene.interaction.text.length
                ? keyboardTapPoint(scene.interaction.text[digitIndex])
                : null;
              if (point) {
                const pointerStartAt = timing.start + timing.step * digitIndex;
                gesture = {
                  x: point.x,
                  y: point.y,
                  width: 0.18,
                  height: 0.052,
                  pointerStartAt,
                  pressAt: pointerStartAt + timing.step * 0.42,
                  rippleAt: pointerStartAt + timing.step * 0.55,
                  responseAt: pointerStartAt + timing.step * 0.72,
                  endAt: pointerStartAt + timing.step * 0.95,
                };
              }
            } else {
              const interactionEnd = scene.start + scene.interaction.start;
              const interactionStart = Math.max(scene.start + 0.06, interactionEnd - 0.52);
              const gestureDuration = Math.max(0.12, interactionEnd - interactionStart);
              if (time >= interactionStart && time < interactionEnd) {
                gesture = {
                  x: scene.interaction.target.x + scene.interaction.target.width / 2,
                  y: scene.interaction.target.y + scene.interaction.target.height / 2,
                  width: scene.interaction.target.width,
                  height: scene.interaction.target.height,
                  pointerStartAt: interactionStart,
                  pressAt: interactionStart + gestureDuration * 0.36,
                  rippleAt: interactionStart + gestureDuration * 0.54,
                  responseAt: interactionStart + gestureDuration * 0.82,
                  endAt: interactionEnd,
                };
              }
            }
          }
          if (!gesture && isTap && scene.keyframes.pointerStartAt !== null) {
            gesture = {
              x,
              y,
              width: action.width,
              height: action.height,
              pointerStartAt: scene.keyframes.pointerStartAt,
              pressAt: scene.keyframes.pressAt,
              rippleAt: scene.keyframes.rippleAt,
              responseAt: scene.keyframes.responseAt,
              endAt: action.start,
            };
          }
          renderGesture(gesture, time, imageRect);

          if (subtitle) {
            const caption = scene.caption || "";
            const [title, ...bodyParts] = caption.split("\n");
            const body = bodyParts.join("\n");
            const subtitleProgress = ease((time - scene.start - 0.14) / 0.42);
            const tutorialStep = scenes
              .slice(0, sceneIndex + 1)
              .filter((item) => Boolean(item.caption))
              .length;
            subtitleStep.textContent = `Step ${String(tutorialStep).padStart(2, "0")}`;
            subtitleTitle.textContent = title || "";
            subtitleBody.textContent = body;
            subtitleBody.style.display = body ? "block" : "none";
            subtitle.style.opacity = caption ? String(subtitleProgress.toFixed(4)) : "0";
            subtitle.style.transform = `translate(${(-26 * (1 - subtitleProgress)).toFixed(2)}px, -50%)`;
          }
          root.style.setProperty("--ambient-x", `${(72 + Math.sin(time * 0.31) * 10).toFixed(2)}%`);
          root.style.setProperty("--ambient-y", `${(16 + Math.cos(time * 0.27) * 8).toFixed(2)}%`);
        };

        const timeline = {
          _time: 0,
          _rate: 1,
          duration() {
            return duration;
          },
          time(value) {
            if (value === undefined) return this._time;
            return this.seek(value);
          },
          totalTime(value) {
            if (value === undefined) return this._time;
            return this.seek(value);
          },
          seek(value) {
            this._time = clamp(Number(value) || 0, 0, duration);
            renderAt(this._time);
            return this;
          },
          pause() {
            return this;
          },
          play() {
            return this;
          },
          timeScale(value) {
            if (value === undefined) return this._rate;
            this._rate = Number(value) || 1;
            return this;
          },
        };

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = timeline;
        renderAt(0.0001);
      })();
    </script>
  </body>
</html>
