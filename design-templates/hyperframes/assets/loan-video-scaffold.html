<!doctype html>
<html lang="__LANG__">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__WIDTH__, height=__HEIGHT__" />
__PRELOADS__
    <link rel="preload" as="image" href="__HAND_ASSET__" />
    <style>
      :root {
        color-scheme: dark;
        --canvas-width: __WIDTH__px;
        --canvas-height: __HEIGHT__px;
        --accent: __ACCENT__;
        --accent-soft: __ACCENT_SOFT__;
        --ambient-x: 78%;
        --ambient-y: 12%;
        --ink: #f8fafc;
        --muted: #b8c0cc;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: var(--canvas-width);
        height: var(--canvas-height);
        margin: 0;
        overflow: hidden;
        background: #080a0f;
      }

      body {
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, sans-serif;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        isolation: isolate;
        background: #080a0f;
      }

      .tutorial-background {
        position: absolute;
        z-index: 0;
        inset: 0;
        overflow: hidden;
        background: #090b11;
      }

      .tutorial-background__image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 1;
      }

      .tutorial__asset-catalog {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
        visibility: hidden;
      }

      .tutorial__asset-catalog img {
        width: 1px;
        height: 1px;
      }

      .tutorial__visual {
        position: absolute;
        z-index: 1;
        inset: 0;
        overflow: hidden;
      }

      .tutorial__camera {
        position: absolute;
        inset: 0;
        will-change: transform;
      }

      .tutorial__asset-slot {
        position: absolute;
        inset: 0;
        opacity: 0;
        will-change: opacity, transform;
      }

      .tutorial__asset-slot--current {
        opacity: 1;
      }

      .tutorial__asset {
        position: absolute;
        display: block;
        object-position: center;
        user-select: none;
      }

      .tutorial__asset-slot[data-presentation="full"] .tutorial__asset {
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .tutorial__asset-slot[data-presentation="device"] .tutorial__asset {
        top: 52%;
        left: 50%;
        width: auto;
        max-width: 78%;
        height: 88%;
        object-fit: contain;
        transform: translate(-50%, -50%);
      }

      .tutorial__focus-layer {
        position: absolute;
        z-index: 2;
        inset: 0;
        pointer-events: none;
      }

      .tutorial__focus-target {
        position: absolute;
        border: clamp(2px, 0.22vmin, 4px) solid transparent;
        border-radius: clamp(5px, 0.7vmin, 12px);
        background: rgba(255, 255, 255, 0.96);
        box-shadow: none;
        opacity: 0;
        will-change: left, top, width, height, opacity, transform;
      }

      .tutorial__press {
        position: absolute;
        z-index: 3;
        left: 50%;
        top: 50%;
        border: clamp(2px, 0.22vmin, 4px) solid rgba(255, 255, 255, 0.8);
        border-radius: clamp(10px, 1.4vmin, 24px);
        background: color-mix(in srgb, var(--accent) 34%, transparent);
        box-shadow: 0 0 24px var(--accent-soft);
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -50%) scale(1);
        will-change: left, top, width, height, opacity, transform;
      }

      .tutorial__tap {
        position: absolute;
        z-index: 4;
        left: 50%;
        top: 50%;
        width: clamp(42px, 4.2vmin, 76px);
        height: clamp(42px, 4.2vmin, 76px);
        border: clamp(3px, 0.32vmin, 6px) solid #fff;
        border-radius: 50%;
        background: color-mix(in srgb, var(--accent) 52%, transparent);
        box-shadow:
          0 0 0 12px color-mix(in srgb, var(--accent) 21%, transparent),
          0 0 32px var(--accent-soft);
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.9);
        will-change: left, top, opacity, transform;
      }

      .tutorial__hand {
        position: absolute;
        z-index: 5;
        left: 50%;
        top: 50%;
        display: block;
        width: 46%;
        height: auto;
        opacity: 0;
        pointer-events: none;
        user-select: none;
        will-change: left, top, width, opacity, transform;
      }

      .tutorial__subtitle {
        position: absolute;
        z-index: 5;
        right: clamp(44px, 7vmin, 132px);
        bottom: clamp(30px, 4.6vmin, 82px);
        left: clamp(44px, 7vmin, 132px);
        overflow: hidden;
        padding: clamp(17px, 1.8vmin, 30px) clamp(28px, 3vmin, 54px);
        border: 1px solid rgba(255, 255, 255, 0.13);
        border-radius: 999px;
        background: rgba(8, 10, 15, 0.78);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.3);
        color: #fff;
        font-size: clamp(24px, 2.25vmin, 44px);
        font-weight: 650;
        line-height: 1.25;
        text-align: center;
        text-overflow: ellipsis;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
        white-space: nowrap;
      }

    </style>
  </head>
  <body class="layout-__LAYOUT__">
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="__DURATION__"
      data-width="__WIDTH__"
      data-height="__HEIGHT__"
    >
      <div class="tutorial-background" data-loan-video-background aria-hidden="true">
        <img class="tutorial-background__image" data-loan-video-background-image src="__INITIAL_BACKGROUND__" alt="" />
      </div>
__ASSET_CATALOG__
      <div class="tutorial__visual">
        <div class="tutorial__camera">
          <div class="tutorial__asset-slot tutorial__asset-slot--current" data-presentation="full">
            <img class="tutorial__asset" data-loan-video-current src="__INITIAL_CURRENT__" alt="" />
          </div>
          <div class="tutorial__asset-slot tutorial__asset-slot--target" data-presentation="full">
            <img class="tutorial__asset" data-loan-video-target src="__INITIAL_TARGET__" alt="" />
          </div>
          <div class="tutorial__focus-layer" data-loan-video-focus-layer aria-hidden="true"></div>
          <span class="tutorial__press" data-loan-video-press aria-hidden="true"></span>
          <span class="tutorial__tap" data-loan-video-tap aria-hidden="true"></span>
          <img class="tutorial__hand" data-loan-video-hand src="__HAND_ASSET__" alt="" aria-hidden="true" />
        </div>
      </div>
__SUBTITLE__
__AUDIO__
    </div>

    <script id="loan-video-manifest" type="application/json">__MANIFEST__</script>
    <script>
      (() => {
        const manifest = JSON.parse(document.getElementById("loan-video-manifest").textContent);
        const duration = manifest.durationSeconds;
        const scenes = manifest.scenes;
        const root = document.getElementById("root");
        const visual = root.querySelector(".tutorial__visual");
        const camera = root.querySelector(".tutorial__camera");
        const currentSlot = root.querySelector(".tutorial__asset-slot--current");
        const targetSlot = root.querySelector(".tutorial__asset-slot--target");
        const currentAsset = root.querySelector("[data-loan-video-current]");
        const targetAsset = root.querySelector("[data-loan-video-target]");
        const backgroundImage = root.querySelector("[data-loan-video-background-image]");
        const focusLayer = root.querySelector("[data-loan-video-focus-layer]");
        const press = root.querySelector("[data-loan-video-press]");
        const tap = root.querySelector(".tutorial__tap");
        const hand = root.querySelector(".tutorial__hand");
        const subtitle = root.querySelector(".tutorial__subtitle");
        const handWidthRatio = 0.46;
        const focusPool = Array.from({ length: 12 }, () => {
          const target = document.createElement("span");
          target.className = "tutorial__focus-target";
          focusLayer.appendChild(target);
          return target;
        });

        const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
        const ease = (value) => 1 - Math.pow(1 - clamp(value, 0, 1), 3);
        const setSource = (image, source) => {
          if (source && image.getAttribute("src") !== source) image.setAttribute("src", source);
          if (!source) image.removeAttribute("src");
        };
        const setPresentation = (slot, presentation) => {
          slot.setAttribute("data-presentation", presentation === "device" ? "device" : "full");
        };
        const displayedImageRect = (image, presentation) => {
          const width = visual.clientWidth;
          const height = visual.clientHeight;
          if (presentation !== "device") return { left: 0, top: 0, width, height };
          const naturalWidth = image.naturalWidth || width;
          const naturalHeight = image.naturalHeight || height;
          const scale = Math.min((width * 0.78) / naturalWidth, (height * 0.88) / naturalHeight);
          const displayedWidth = naturalWidth * scale;
          const displayedHeight = naturalHeight * scale;
          return {
            left: (width - displayedWidth) / 2,
            top: height * 0.52 - displayedHeight / 2,
            width: displayedWidth,
            height: displayedHeight,
          };
        };

        const renderFocusTargets = (scene, time, imageRect) => {
          const targets = scene.presentation === "device" ? (scene.focusTargets || []) : [];
          const localTime = time - scene.start;
          const revealWindow = Math.max(0.36, scene.duration * 0.48);
          focusPool.forEach((element, index) => {
            const target = targets[index];
            if (!target) {
              element.style.opacity = "0";
              return;
            }
            const step = revealWindow / Math.max(1, targets.length);
            const start = Math.max(0.18, scene.duration * 0.1) + step * index;
            const end = start + Math.min(0.34, Math.max(0.18, step * 0.72));
            const progress = ease((localTime - start) / Math.max(0.000001, end - start));
            const active = localTime >= start && localTime < end;
            element.style.left = `${(imageRect.left + imageRect.width * target.x).toFixed(2)}px`;
            element.style.top = `${(imageRect.top + imageRect.height * target.y).toFixed(2)}px`;
            element.style.width = `${(imageRect.width * target.width).toFixed(2)}px`;
            element.style.height = `${(imageRect.height * target.height).toFixed(2)}px`;
            element.style.opacity = localTime < start
              ? "0.96"
              : String((active ? 0.96 * (1 - progress) : 0).toFixed(4));
            element.style.borderColor = active ? "rgba(255, 106, 42, 0.88)" : "transparent";
            element.style.boxShadow = active
              ? "0 0 0 8px rgba(255, 106, 42, 0.12)"
              : "none";
            element.style.transform = `scale(${(active ? 1 - Math.sin(Math.PI * progress) * 0.025 : 1).toFixed(4)})`;
          });
        };

        const renderAt = (seconds) => {
          const time = clamp(Number(seconds) || 0, 0, Math.max(0, duration));
          let sceneIndex = scenes.findIndex((scene) => time < scene.start + scene.duration - 0.000001);
          if (sceneIndex < 0) sceneIndex = scenes.length - 1;
          const scene = scenes[sceneIndex];
          const targetScene = scene.transition.targetSceneIndex
            ? scenes[scene.transition.targetSceneIndex - 1]
            : null;
          const transitionProgress = targetScene && scene.transition.start !== null
            ? ease((time - scene.transition.start) / (scene.transition.end - scene.transition.start))
            : 0;

          const currentPresentation = scene.presentation || "full";
          const targetPresentation = targetScene?.presentation || "full";
          setSource(backgroundImage, manifest.backgroundAsset || scene.asset);
          setSource(currentAsset, scene.asset);
          setSource(targetAsset, targetScene?.asset);
          setPresentation(currentSlot, currentPresentation);
          setPresentation(targetSlot, targetPresentation);
          currentSlot.style.opacity = String(1 - transitionProgress);
          targetSlot.style.opacity = String(transitionProgress);
          const deviceToDevice = currentPresentation === "device"
            && targetPresentation === "device";
          if (deviceToDevice) {
            currentSlot.style.transform = `translateX(${(-4 * transitionProgress).toFixed(3)}%) scale(${(1 - transitionProgress * 0.008).toFixed(4)})`;
            targetSlot.style.transform = `translateX(${(7 * (1 - transitionProgress)).toFixed(3)}%) scale(${(0.99 + transitionProgress * 0.01).toFixed(4)})`;
          } else if (currentPresentation === "full" && targetPresentation === "device") {
            currentSlot.style.transform = "none";
            targetSlot.style.transform = `translateY(${(6 * (1 - transitionProgress)).toFixed(3)}%) scale(${(0.96 + transitionProgress * 0.04).toFixed(4)})`;
          } else if (currentPresentation === "device" && targetPresentation === "full") {
            currentSlot.style.transform = `translateY(${(-3 * transitionProgress).toFixed(3)}%) scale(${(1 - transitionProgress * 0.02).toFixed(4)})`;
            targetSlot.style.transform = "none";
          } else {
            currentSlot.style.transform = "none";
            targetSlot.style.transform = "none";
          }

          const action = scene.transition;
          const isTap = action.type === "tap";
          const x = isTap ? action.x : 0.5;
          const y = isTap ? action.y : 0.5;
          const imageRect = displayedImageRect(currentAsset, currentPresentation);
          const focalX = imageRect.left + imageRect.width * x;
          const focalY = imageRect.top + imageRect.height * y;
          camera.style.transformOrigin = `${focalX.toFixed(2)}px ${focalY.toFixed(2)}px`;

          const focusStart = scene.keyframes.pointerStartAt
            ?? scene.keyframes.responseAt
            ?? scene.keyframes.currentAt;
          const focusEnd = isTap
            ? (scene.keyframes.responseAt ?? action.start ?? (scene.start + scene.duration))
            : (action.start ?? (scene.start + scene.duration));
          const approach = ease((time - focusStart) / Math.max(0.000001, focusEnd - focusStart));
          const focus = action.start !== null && time >= action.start
            ? 1 - transitionProgress
            : approach;
          const zoomAmount = isTap ? 0.075 : action.type === "auto" ? 0.022 : 0;
          const panX = isTap ? (0.5 - x) * imageRect.width * 0.13 * focus : 0;
          const panY = isTap ? (0.5 - y) * imageRect.height * 0.13 * focus : 0;
          camera.style.transform = `translate(${panX.toFixed(2)}px, ${panY.toFixed(2)}px) scale(${(1 + zoomAmount * focus).toFixed(5)})`;
          renderFocusTargets(scene, time, imageRect);

          if (isTap && scene.keyframes.pointerStartAt !== null) {
            const pointerProgress = ease(
              (time - scene.keyframes.pointerStartAt)
                / Math.max(0.000001, scene.keyframes.pressAt - scene.keyframes.pointerStartAt),
            );
            const pressProgress = clamp(
              (time - scene.keyframes.pressAt)
                / Math.max(0.000001, scene.keyframes.rippleAt - scene.keyframes.pressAt),
              0,
              1,
            );
            const rippleProgress = clamp(
              (time - scene.keyframes.rippleAt)
                / Math.max(0.000001, scene.keyframes.responseAt - scene.keyframes.rippleAt),
              0,
              1,
            );
            const responseProgress = clamp(
              (time - scene.keyframes.responseAt)
                / Math.max(0.000001, action.start - scene.keyframes.responseAt),
              0,
              1,
            );
            const visible = time >= scene.keyframes.pointerStartAt && time < action.start;
            const ripple = Math.sin(Math.PI * rippleProgress);
            tap.style.left = `${focalX.toFixed(2)}px`;
            tap.style.top = `${focalY.toFixed(2)}px`;
            tap.style.opacity = visible
              ? String((pointerProgress * (1 - responseProgress) * 0.96).toFixed(4))
              : "0";
            tap.style.transform = `translate(-50%, -50%) scale(${(
              0.9 - pressProgress * 0.08 + ripple * 0.3
            ).toFixed(4)})`;

            const pressWidth = imageRect.width * (action.width || 0.16);
            const pressHeight = imageRect.height * (action.height || 0.055);
            press.style.left = `${focalX.toFixed(2)}px`;
            press.style.top = `${focalY.toFixed(2)}px`;
            press.style.width = `${pressWidth.toFixed(2)}px`;
            press.style.height = `${pressHeight.toFixed(2)}px`;
            press.style.opacity = visible
              ? String((pressProgress * (1 - responseProgress) * 0.78).toFixed(4))
              : "0";
            press.style.transform = `translate(-50%, -50%) scale(${(1 - pressProgress * 0.035 + ripple * 0.018).toFixed(4)})`;

            const handWidth = clamp(imageRect.width * handWidthRatio, 150, 420);
            const mirrored = x > 0.72;
            const anchorX = handWidth * (mirrored ? 0.86 : 0.14);
            const anchorY = handWidth * 0.085;
            const approachOffsetX = (mirrored ? -1 : 1)
              * imageRect.width * 0.17 * (1 - pointerProgress);
            const approachOffsetY = imageRect.height * 0.075 * (1 - pointerProgress);
            const pressDepth = imageRect.width * 0.008 * pressProgress;
            const lift = imageRect.width * 0.006 * rippleProgress;
            const handScale = 1 - pressProgress * 0.025 + ripple * 0.012;
            hand.style.left = `${focalX.toFixed(2)}px`;
            hand.style.top = `${focalY.toFixed(2)}px`;
            hand.style.width = `${handWidth.toFixed(2)}px`;
            hand.style.opacity = visible
              ? String((pointerProgress * (1 - responseProgress)).toFixed(4))
              : "0";
            hand.style.transformOrigin = `${anchorX.toFixed(2)}px ${anchorY.toFixed(2)}px`;
            hand.style.transform = `translate(${(
              -anchorX + approachOffsetX + pressDepth - lift
            ).toFixed(2)}px, ${(
              -anchorY + approachOffsetY + pressDepth - lift
            ).toFixed(2)}px) rotate(${mirrored ? "-2deg" : "2deg"}) scaleX(${mirrored ? -1 : 1}) scale(${handScale.toFixed(4)})`;
          } else {
            press.style.opacity = "0";
            tap.style.opacity = "0";
            hand.style.opacity = "0";
          }

          if (subtitle) {
            subtitle.textContent = scene.caption || "";
            subtitle.style.opacity = scene.caption ? "1" : "0";
          }
          root.style.setProperty("--ambient-x", `${(72 + Math.sin(time * 0.31) * 10).toFixed(2)}%`);
          root.style.setProperty("--ambient-y", `${(16 + Math.cos(time * 0.27) * 8).toFixed(2)}%`);
        };

        const timeline = {
          _time: 0,
          _rate: 1,
          duration() {
            return duration;
          },
          time(value) {
            if (value === undefined) return this._time;
            return this.seek(value);
          },
          totalTime(value) {
            if (value === undefined) return this._time;
            return this.seek(value);
          },
          seek(value) {
            this._time = clamp(Number(value) || 0, 0, duration);
            renderAt(this._time);
            return this;
          },
          pause() {
            return this;
          },
          play() {
            return this;
          },
          timeScale(value) {
            if (value === undefined) return this._rate;
            this._rate = Number(value) || 1;
            return this;
          },
        };

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = timeline;
        renderAt(0.0001);
      })();
    </script>
  </body>
</html>
